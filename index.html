<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スマホをやめれば魚が育つ — 集中するほど水槽が賑やかになるアプリ</title>
  <meta name="description" content="スマホを置いて集中している間、水槽の魚たちが育っていく。やめたい気持ちを、かわいい魚を育てる楽しさに変えるiOSアプリ「スマやめ」。">

  <!-- ============================================ -->
  <!-- Open Graph (Facebook / Discord / Slack 等)    -->
  <!-- ============================================ -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://segawatks.github.io/sumayame/">
  <meta property="og:title" content="スマホをやめれば魚が育つ">
  <meta property="og:description" content="集中時間がかわいい魚に変わる。スマホ依存を、魚を育てる楽しさへ。">
  <meta property="og:image" content="https://segawatks.github.io/sumayame/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="スマホをやめれば魚が育つ">
  <meta property="og:site_name" content="スマやめ">
  <meta property="og:locale" content="ja_JP">

  <!-- ============================================ -->
  <!-- X (Twitter) Card — summary_large_image方式     -->
  <!-- (twitter:card=app は2023年以降ほぼ機能停止状態  -->
  <!--  なので summary_large_image でカード表示を確実化)-->
  <!-- ============================================ -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@rikodesign">
  <meta name="twitter:title" content="スマホをやめれば魚が育つ">
  <meta name="twitter:description" content="スマホをやめれば、魚が育つ。集中時間がかわいい魚に変わるiOSアプリ。">
  <meta name="twitter:image" content="https://segawatks.github.io/sumayame/og.png">

  <!-- ============================================ -->
  <!-- Apple Smart App Banner (Safari for iOS)       -->
  <!-- ============================================ -->
  <meta name="apple-itunes-app" content="app-id=1669133971">

  <!-- ============================================ -->
  <!-- App Links / Universal Links Hints             -->
  <!-- ============================================ -->
  <meta property="al:ios:app_store_id" content="1669133971">
  <meta property="al:ios:app_name" content="スマホをやめれば魚が育つ">
  <meta property="al:ios:url" content="https://apps.apple.com/jp/app/id1669133971">
  <meta property="al:web:url" content="https://segawatks.github.io/sumayame/">

  <!-- Canonical -->
  <link rel="canonical" href="https://segawatks.github.io/sumayame/">

  <!-- Favicon (任意・後で差し替えOK) -->
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    :root {
      --bg: #f4fbff;
      --ink: #1c2a3a;
      --sub: #5a6b7e;
      --accent: #2aa3d6;
      --accent-deep: #0d6f9e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
      background: linear-gradient(180deg, #e9f6ff 0%, #ffffff 60%);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      line-height: 1.7;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 24px 96px;
    }
    .eyebrow {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--accent-deep);
      background: #d6efff;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 32px;
      line-height: 1.35;
      margin: 0 0 16px;
      letter-spacing: 0.02em;
    }
    .lead {
      font-size: 17px;
      color: var(--sub);
      margin: 0 0 32px;
    }
    .card {
      background: #fff;
      border: 1px solid #e1edf5;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 6px 30px rgba(20, 80, 120, 0.06);
      margin-bottom: 24px;
    }
    .card h2 {
      font-size: 18px;
      margin: 0 0 8px;
    }
    .card p {
      margin: 0;
      color: var(--sub);
      font-size: 15px;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 15px;
      margin-top: 8px;
      transition: transform .15s ease, background .15s ease;
    }
    .cta:hover { background: var(--accent-deep); transform: translateY(-1px); }
    footer {
      margin-top: 48px;
      font-size: 12px;
      color: #9aa9b8;
      text-align: center;
    }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">iOS APP</span>
    <h1>スマホをやめれば魚が育つ</h1>
    <p class="lead">
      App Store に移動しています…<br>
      自動で開かない場合は、下のボタンを押してください。
    </p>
    <a class="cta" id="store-btn" href="itms-apps://itunes.apple.com/jp/app/id1669133971">App Store を開く →</a>

    <div class="card" style="margin-top:24px; font-size:14px;">
      <h2 style="font-size:14px; margin-bottom:8px;">それでも開かない場合</h2>
      <p>X や Instagram の内蔵ブラウザだと App Store に飛ばないことがあります。画面右上（または右下）のメニューから <strong>「Safariで開く」</strong> を選ぶと、確実に App Store が起動します。</p>
    </div>

    <footer>
      © Riko Design / Segawa
    </footer>
  </main>
  <script>
    // ====================================================
    // App Store 自動リダイレクト（body末尾に配置：
    //   head内に置くとクローラがメタタグ読む前に
    //   遷移判定してカード生成が阻害される可能性があるため）
    // ====================================================
    (function () {
      var ua = navigator.userAgent || '';
      var isBot = /bot|crawler|spider|crawling|facebookexternalhit|twitterbot|slackbot|discordbot|linkedinbot|whatsapp|telegrambot/i.test(ua);
      if (isBot) return;

      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      var itmsURL = 'itms-apps://itunes.apple.com/jp/app/id1669133971';
      var httpsURL = 'https://apps.apple.com/jp/app/id1669133971';

      if (isIOS) {
        window.location.href = itmsURL;
        setTimeout(function () { window.location.href = httpsURL; }, 800);
      } else {
        window.location.href = httpsURL;
      }
    })();

    // ボタンクリックも itms-apps://、ダメなら https://
    document.getElementById('store-btn').addEventListener('click', function (e) {
      var ua = navigator.userAgent || '';
      if (/iPhone|iPad|iPod/i.test(ua)) {
        setTimeout(function () {
          window.location.href = 'https://apps.apple.com/jp/app/id1669133971';
        }, 800);
      }
    });
  </script>
</body>
</html>
