<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スマホをやめれば魚が育つ — 集中するほど水槽が賑やかになるアプリ</title>
  <meta name="description" content="スマホを置いて集中している間、水槽の魚たちが育っていく。やめたい気持ちを、かわいい魚を育てる楽しさに変えるiOSアプリ「スマやめ」。">

  <!-- ============================================ -->
  <!-- Open Graph (Facebook / Discord / Slack 等)    -->
  <!-- ============================================ -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://segawatks.github.io/sumayame/">
  <meta property="og:title" content="スマホ依存防止アプリ">
  <meta property="og:description" content="集中時間がかわいい魚に変わる。スマホ依存を、魚を育てる楽しさへ。">
  <meta property="og:image" content="https://segawatks.github.io/sumayame/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="スマホをやめれば魚が育つ">
  <meta property="og:site_name" content="スマやめ">
  <meta property="og:locale" content="ja_JP">

  <!-- ============================================ -->
  <!-- X (Twitter) Card — summary_large_image方式     -->
  <!-- (twitter:card=app は2023年以降ほぼ機能停止状態  -->
  <!--  なので summary_large_image でカード表示を確実化)-->
  <!-- ============================================ -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@rikodesign">
  <meta name="twitter:title" content="スマホ依存防止アプリ">
  <meta name="twitter:description" content="スマホをやめれば、魚が育つ。集中時間がかわいい魚に変わるiOSアプリ。">
  <meta name="twitter:image" content="https://segawatks.github.io/sumayame/og.png">

  <!-- ============================================ -->
  <!-- Apple Smart App Banner (Safari for iOS)       -->
  <!-- ============================================ -->
  <meta name="apple-itunes-app" content="app-id=1669133971">

  <!-- ============================================ -->
  <!-- App Links / Universal Links Hints             -->
  <!-- ============================================ -->
  <meta property="al:ios:app_store_id" content="1669133971">
  <meta property="al:ios:app_name" content="スマホをやめれば魚が育つ">
  <meta property="al:ios:url" content="https://apps.apple.com/jp/app/id1669133971">
  <meta property="al:web:url" content="https://segawatks.github.io/sumayame/">

  <!-- Canonical -->
  <link rel="canonical" href="https://segawatks.github.io/sumayame/">

  <!-- Favicon (任意・後で差し替えOK) -->
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    html, body { margin: 0; padding: 0; }
    body { -webkit-tap-highlight-color: transparent; }
    a { display: block; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <a id="store-link" href="https://apps.apple.com/jp/app/id1669133971">
    <img src="top.jpg" alt="スマホをやめれば魚が育つ">
  </a>
  <script>
    // どこをタップしても App Store へ
    // - <a> の通常navigationを止めて、iOS のときだけ itms-apps:// 優先
    // - JS無効環境でも <a href="https://apps.apple.com/..."> がそのまま機能
    function goToStore (e) {
      if (e) e.preventDefault();
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      if (isIOS) {
        window.location.href = 'itms-apps://itunes.apple.com/jp/app/id1669133971';
        setTimeout(function () {
          window.location.href = 'https://apps.apple.com/jp/app/id1669133971';
        }, 600);
      } else {
        window.location.href = 'https://apps.apple.com/jp/app/id1669133971';
      }
    }
    document.body.addEventListener('click', goToStore);
  </script>
</body>
</html>
